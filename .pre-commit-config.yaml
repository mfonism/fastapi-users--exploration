repos:
  - repo: local
    hooks:
      - id: check-alembic-migrations
        name: Check Alembic migrations are not empty
        entry: uv run python scripts/check_empty_migrations.py
        language: system
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        name: Lint with ruff
        args: [--fix]
        types_or: [python]
      - id: ruff-format
        name: Format with ruff
